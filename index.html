<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquityLens Multi-Source | Stock Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; --border: #e2e8f0; }
        .theme-dark { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #38bdf8; --border: #334155; }
        .theme-solarized { --bg: #fdf6e3; --card: #eee8d5; --text: #586e75; --accent: #b58900; --border: #d5c4a1; }

        body { background-color: var(--bg); color: var(--text); transition: all 0.3s ease; }
        .glass-card { background-color: var(--card); border: 1px solid var(--border); }
        .toggle-btn.active { background-color: var(--accent); color: white; border-color: var(--accent); }
        select, input { background-color: var(--bg) !important; color: var(--text) !important; border-color: var(--border) !important; }
        
        #helpModal { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-4xl font-black tracking-tight flex items-center gap-2">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    EquityLens
                </h1>
                <p class="opacity-60 font-medium">Cross-verify market data across leading financial APIs</p>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex bg-slate-200/50 p-1 rounded-xl">
                    <button onclick="setTheme('light')" class="px-3 py-1 text-xs font-bold uppercase rounded-lg hover:bg-white/50">Light</button>
                    <button onclick="setTheme('dark')" class="px-3 py-1 text-xs font-bold uppercase rounded-lg hover:bg-white/50">Dark</button>
                    <button onclick="setTheme('solarized')" class="px-3 py-1 text-xs font-bold uppercase rounded-lg hover:bg-white/50">Solar</button>
                </div>
                <button onclick="toggleHelp(true)" class="glass-card shadow-sm text-slate-400 w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl hover:text-blue-600 transition-all">?</button>
            </div>
        </header>

        <!-- Help Modal -->
        <div id="helpModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="glass-card rounded-3xl shadow-2xl max-w-md w-full p-8 relative">
                <button onclick="toggleHelp(false)" class="absolute top-4 right-4 opacity-50 hover:opacity-100 p-2">✕</button>
                <h2 class="text-2xl font-black mb-4">About EquityLens</h2>
                <p class="opacity-70 leading-relaxed mb-4">Technical analyzer developed by <strong>Saurabh Gayali</strong>.</p>
                <p class="text-sm text-blue-600 font-medium pt-4 border-t border-slate-200">Support: saurabh.gayali@gmail.com</p>
            </div>
        </div>

        <!-- Configuration -->
        <div class="glass-card rounded-3xl shadow-2xl p-6 md:p-8 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold opacity-50 uppercase mb-2">Data Provider</label>
                    <select id="apiProvider" onchange="handleProviderChange()" class="w-full p-3 rounded-xl font-semibold outline-none border">
                        <option value="alphavantage">Alpha Vantage</option>
                        <option value="rapidapi_yahoo">Yahoo Finance (RapidAPI)</option>
                        <option value="twelvedata">Twelve Data</option>
                    </select>
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-bold opacity-50 uppercase mb-2">API Secret Key</label>
                    <input type="password" id="apiKey" placeholder="Authentication required" class="w-full p-3 rounded-xl border outline-none">
                </div>
                <div class="md:col-span-3">
                    <label class="block text-xs font-bold opacity-50 uppercase mb-2">Ticker Symbol</label>
                    <input type="text" id="symbol" placeholder="IBM" class="w-full p-3 rounded-xl border outline-none uppercase font-bold text-blue-600">
                </div>
                <div class="md:col-span-2 flex items-end">
                    <button onclick="fetchStockData()" id="fetchBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all active:scale-95">Analyze</button>
                </div>
            </div>
            
            <div id="providerInfo" class="mt-6 pt-6 border-t border-slate-200 text-sm"></div>
            <div id="statusMessage" class="hidden mt-4 p-4 rounded-xl text-sm border flex items-center gap-3"></div>
        </div>

        <!-- Charts Area -->
        <div id="loading" class="hidden text-center py-20 glass-card rounded-3xl mb-8">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-slate-200 border-t-blue-600 mx-auto"></div>
        </div>

        <div id="chartsArea" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Chart 1: Market Trend -->
            <div class="glass-card p-6 rounded-3xl shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="mainChartTitle" class="text-sm font-bold opacity-40 uppercase tracking-widest">Market Trend</h3>
                    <div class="flex bg-slate-100/10 rounded-lg p-1">
                        <button onclick="updateViewMode('rank')" id="btnRank" class="toggle-btn active text-[10px] px-3 py-1 rounded-md font-bold uppercase transition-all">Rank</button>
                        <button onclick="updateViewMode('price')" id="btnPrice" class="toggle-btn text-[10px] px-3 py-1 rounded-md font-bold uppercase transition-all">Price</button>
                    </div>
                </div>
                <div class="h-80"><canvas id="mainChart"></canvas></div>
            </div>

            <!-- Chart 2: Elite Tier (Scatter Plot) -->
            <div class="glass-card p-6 rounded-3xl shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="topChartTitle" class="text-sm font-bold opacity-40 uppercase tracking-widest">Elite Tier Analysis</h3>
                    <select id="niftySelector" onchange="renderCharts(currentLabels, currentRanks, currentRawPrices)" class="text-[10px] font-bold uppercase border-none rounded-lg px-2 py-1 outline-none">
                        <option value="50">Nifty 50</option>
                        <option value="100" selected>Nifty 100</option>
                    </select>
                </div>
                <div id="top100Msg" class="hidden h-80 flex items-center justify-center opacity-40 italic">No Elite Tier entry found.</div>
                <div class="h-80" id="topChartContainer"><canvas id="topChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        let charts = {};
        let currentRawPrices = [];
        let currentRanks = [];
        let currentLabels = [];
        let viewMode = 'rank';
        let currentDisplaySymbol = "DUMMY";
        
        const providerConfigs = {
            alphavantage: { name: "Alpha Vantage", symbolHint: "IBM", link: "https://www.alphavantage.co/support/#api-key" },
            rapidapi_yahoo: { name: "Yahoo Finance (RapidAPI)", symbolHint: "IBM", link: "https://rapidapi.com/apidojo/api/yahoo-finance1" },
            twelvedata: { name: "Twelve Data", symbolHint: "RELIANCE:NSE", link: "https://twelvedata.com/pricing" }
        };

        function setTheme(theme) {
            document.body.className = `min-h-screen p-4 md:p-8 font-sans theme-${theme}`;
            localStorage.setItem('eq_theme', theme);
            renderCharts(currentLabels, currentRanks, currentRawPrices);
        }

        const formatAxisDate = (dateInput) => {
            const date = new Date(dateInput);
            if (isNaN(date.getTime())) return dateInput;
            const month = date.toLocaleString('default', { month: 'short' });
            const year = date.getFullYear().toString().substr(-2);
            return `${month} ${year}`;
        };

        function toggleHelp(show) { document.getElementById('helpModal').classList.toggle('hidden', !show); }

        window.onload = () => {
            const savedTheme = localStorage.getItem('eq_theme') || 'light';
            setTheme(savedTheme);
            handleProviderChange();
            handleVisualization("DUMMY", true);
        };

        function handleProviderChange() {
            const provider = document.getElementById('apiProvider').value;
            const config = providerConfigs[provider];
            document.getElementById('apiKey').value = localStorage.getItem(`api_key_${provider}`) || "";
            document.getElementById('symbol').placeholder = `e.g. ${config.symbolHint}`;
            document.getElementById('providerInfo').innerHTML = `<div class="flex items-center justify-between opacity-80 p-3 rounded-xl border border-slate-200"><span class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold">${config.name}</span><a href="${config.link}" target="_blank" class="text-blue-600 font-bold">Get API Key</a></div>`;
        }

        function updateViewMode(mode) {
            viewMode = mode;
            document.getElementById('btnRank').classList.toggle('active', mode === 'rank');
            document.getElementById('btnPrice').classList.toggle('active', mode === 'price');
            renderCharts(currentLabels, currentRanks, currentRawPrices);
        }

        async function fetchStockData() {
            const provider = document.getElementById('apiProvider').value;
            const key = document.getElementById('apiKey').value.trim();
            let symbol = document.getElementById('symbol').value.toUpperCase().trim();
            
            // Logic: if key OR symbol empty -> load dummy
            if (!key || !symbol) {
                showStatus("Missing credentials. Loading simulation...", "info");
                handleVisualization("DUMMY", true);
                return;
            }

            localStorage.setItem(`api_key_${provider}`, key);
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('statusMessage').classList.add('hidden');

            try {
                if (provider === 'alphavantage') {
                    const url = `https://www.alphavantage.co/query?function=TIME_SERIES_MONTHLY&symbol=${symbol}&apikey=${key}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data['Error Message'] || data['Note'] || data['Information']) throw new Error(data['Error Message'] || data['Note'] || "Invalid Response");
                    const ts = data['Monthly Time Series'] || data['Monthly Adjusted Time Series'];
                    if (!ts) throw new Error("Data not found.");
                    const keys = Object.keys(ts).sort(); 
                    currentLabels = keys; 
                    currentRawPrices = keys.map(k => parseFloat(ts[k]['4. close'] || ts[k]['5. adjusted close']));
                    currentRanks = mapToRanks(currentRawPrices);
                } else if (provider === 'rapidapi_yahoo') {
                    const url = `https://apidojo-yahoo-finance-v1.p.rapidapi.com/stock/v2/get-chart?interval=1mo&region=US&symbol=${symbol}&range=10y`;
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: { 'x-rapidapi-key': key, 'x-rapidapi-host': 'apidojo-yahoo-finance-v1.p.rapidapi.com' }
                    });
                    const data = await response.json();
                    const result = data.chart?.result?.[0];
                    if (!result) throw new Error("Failed to load Yahoo data.");
                    const validData = result.timestamp.map((t, i) => ({ t: t * 1000, v: result.indicators?.quote?.[0]?.close[i] })).filter(item => item.v !== null);
                    currentLabels = validData.map(d => new Date(d.t).toISOString().split('T')[0]); 
                    currentRawPrices = validData.map(d => d.v);
                    currentRanks = mapToRanks(currentRawPrices);
                } else if (provider === 'twelvedata') {
                    const url = `https://api.twelvedata.com/time_series?symbol=${symbol}&interval=1month&outputsize=120&apikey=${key}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.status === 'error') throw new Error(data.message);
                    const sortedData = data.values.reverse();
                    currentLabels = sortedData.map(d => d.datetime);
                    currentRawPrices = sortedData.map(d => parseFloat(d.close));
                    currentRanks = mapToRanks(currentRawPrices);
                }

                currentDisplaySymbol = symbol;
                handleVisualization(symbol, false, currentLabels, currentRanks, providerConfigs[provider].name);

            } catch (err) {
                showStatus(`Error: ${err.message}. Loading simulation...`, "error");
                handleVisualization("DUMMY", true);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function mapToRanks(prices) {
            const max = Math.max(...prices);
            const min = Math.min(...prices);
            return prices.map(p => {
                const range = max - min;
                return range === 0 ? 500 : Math.round(500 - ((p - min) / range * 499) + 1);
            });
        }

        function handleVisualization(symbol, isDummy, labels = [], ranks = [], provider = "") {
            if (isDummy) {
                currentDisplaySymbol = "DUMMY";
                currentLabels = Array.from({length: 60}, (_, i) => {
                    const d = new Date();
                    d.setMonth(d.getMonth() - (60 - i));
                    return d.toISOString().split('T')[0];
                });
                currentRawPrices = Array.from({length: 60}, (_, i) => 100 + (i * 2) + (Math.random() * 20));
                currentRanks = mapToRanks(currentRawPrices);
            }
            document.getElementById('mainChartTitle').innerText = `${isDummy ? 'DUMMY' : provider} | ${currentDisplaySymbol}`;
            document.getElementById('topChartTitle').innerText = `Elite Tier | ${currentDisplaySymbol}`;
            renderCharts(currentLabels, currentRanks, currentRawPrices);
        }

        function calculateRegression(x, y) {
            const n = x.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            for (let i = 0; i < n; i++) {
                sumX += x[i];
                sumY += y[i];
                sumXY += x[i] * y[i];
                sumXX += x[i] * x[i];
            }
            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            return { slope, intercept };
        }

        function renderCharts(labels, rankData, priceData) {
            const formattedLabels = labels.map(l => formatAxisDate(l));
            const displayData = viewMode === 'rank' ? rankData : priceData;
            const displayLabel = viewMode === 'rank' ? 'Rank' : 'Price';
            
            // Chart 1: Line Chart
            renderChart('mainChart', 'line', formattedLabels, displayData, displayLabel, '#3b82f6', viewMode === 'rank');

            // Chart 2: Scatter Plot with Trendline
            const niftyLimit = parseInt(document.getElementById('niftySelector').value);
            const scatterData = [];
            const regressionX = [];
            const regressionY = [];

            rankData.forEach((v, i) => {
                if (v <= niftyLimit) {
                    scatterData.push({ x: i, y: v, label: formattedLabels[i] });
                    regressionX.push(i);
                    regressionY.push(v);
                }
            });

            const hasTop = scatterData.length > 0;
            document.getElementById('top100Msg').classList.toggle('hidden', hasTop);
            document.getElementById('topChartContainer').classList.toggle('hidden', !hasTop);

            if (hasTop) {
                const { slope, intercept } = calculateRegression(regressionX, regressionY);
                // Extend trendline beyond min/max
                const minX = Math.min(...regressionX) - 5;
                const maxX = Math.max(...regressionX) + 5;
                
                const trendlineData = [
                    { x: minX, y: slope * minX + intercept },
                    { x: maxX, y: slope * maxX + intercept }
                ];

                renderScatter('topChart', scatterData, trendlineData, formattedLabels, niftyLimit);
            }
        }

        function renderChart(id, type, labels, data, label, color, reverseY) {
            if (charts[id]) charts[id].destroy();
            charts[id] = new Chart(document.getElementById(id), {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{ 
                        label: label, 
                        data: data, 
                        borderColor: color, 
                        backgroundColor: color + '22',
                        tension: 0.3, 
                        fill: true, 
                        borderWidth: 2,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { 
                        y: { reverse: reverseY, ticks: { font: { size: 9 } } },
                        x: { ticks: { font: { size: 9 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 10 } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderScatter(id, data, trend, allLabels, limit) {
            if (charts[id]) charts[id].destroy();
            const accentColor = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#3b82f6';
            
            charts[id] = new Chart(document.getElementById(id), {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            label: 'Elite Entry',
                            data: data,
                            backgroundColor: '#10b981',
                            pointRadius: 4,
                            pointHoverRadius: 6
                        },
                        {
                            label: 'Trendline',
                            data: trend,
                            type: 'line',
                            borderColor: accentColor,
                            borderDash: [5, 5],
                            borderWidth: 2,
                            fill: false,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { 
                            reverse: true, 
                            min: 0, 
                            max: limit + 20, 
                            title: { display: true, text: 'Rank', font: { size: 10 } }
                        },
                        x: {
                            type: 'linear',
                            min: Math.min(...data.map(d => d.x)) - 5,
                            max: Math.max(...data.map(d => d.x)) + 5,
                            ticks: {
                                callback: (value) => allLabels[Math.round(value)] || '',
                                font: { size: 9 }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    if (ctx.datasetIndex === 0) {
                                        return ` Rank: ${ctx.raw.y} (${ctx.raw.label})`;
                                    }
                                    return null;
                                }
                            }
                        }
                    }
                }
            });
        }

        function showStatus(text, type) {
            const msg = document.getElementById('statusMessage');
            msg.innerText = text;
            msg.className = `mt-4 p-4 rounded-xl text-sm border ${type === 'error' ? 'bg-red-500/10 text-red-500 border-red-500/20' : 'bg-blue-500/10 text-blue-500 border-blue-500/20'}`;
            msg.classList.remove('hidden');
        }
    </script>
</body>
</html>
